apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Docker Desktop runs this platform on a single, memory-constrained node.
# Keep one replica and avoid surge pods so deployments can roll out locally.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: app-.*
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /spec/strategy
        value:
          type: Recreate

  - target:
      group: autoscaling
      version: v2
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 1

images:
  - name: api-gateway
    newName: ghcr.io/anujyadav11/api-gateway
    newTag: latest
  - name: auth-service
    newName: ghcr.io/anujyadav11/auth-service
    newTag: latest
  - name: config-server
    newName: ghcr.io/anujyadav11/config-server
    newTag: latest
  - name: discovery-server
    newName: ghcr.io/anujyadav11/discovery-server
    newTag: latest
  - name: order-service
    newName: ghcr.io/anujyadav11/order-service
    newTag: latest
  - name: inventory-service
    newName: ghcr.io/anujyadav11/inventory-service
    newTag: latest
  - name: pricing-service
    newName: ghcr.io/anujyadav11/pricing-service
    newTag: latest
  - name: payment-service
    newName: ghcr.io/anujyadav11/payment-service
    newTag: latest
  - name: notification-service
    newName: ghcr.io/anujyadav11/notification-service
    newTag: latest
  - name: delivery-service
    newName: ghcr.io/anujyadav11/delivery-service
    newTag: latest
  - name: websocket-service
    newName: ghcr.io/anujyadav11/websocket-service
    newTag: latest
  - name: saga-orchestrator
    newName: ghcr.io/anujyadav11/saga-orchestrator
    newTag: latest
