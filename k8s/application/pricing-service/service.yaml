apiVersion: v1
kind: Service

metadata:
  name: pricing-service
  namespace: eventstream

  labels:
    app: pricing-service
    app.kubernetes.io/name: pricing-service
    app.kubernetes.io/part-of: eventstream

spec:
  type: ClusterIP

  selector:
    app: pricing-service

  ports:
    - name: http
      port: 8089
      targetPort: http
      protocol: TCP