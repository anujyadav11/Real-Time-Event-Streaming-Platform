apiVersion: v1
kind: Service

metadata:
  name: inventory-service
  namespace: eventstream

  labels:
    app: inventory-service
    app.kubernetes.io/name: inventory-service
    app.kubernetes.io/part-of: eventstream

spec:
  type: ClusterIP

  selector:
    app: inventory-service

  ports:
    - name: http
      port: 8082
      targetPort: http
      protocol: TCP