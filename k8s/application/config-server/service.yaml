apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: eventstream
  labels:
    app: config-server
    app.kubernetes.io/name: config-server
    app.kubernetes.io/part-of: eventstream

spec:
  type: ClusterIP

  selector:
    app: config-server

  ports:
    - name: http
      port: 8888
      targetPort: http
      protocol: TCP