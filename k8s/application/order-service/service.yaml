apiVersion: v1
kind: Service

metadata:
  name: order-service
  namespace: eventstream

  labels:
    app: order-service
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: eventstream

spec:
  type: ClusterIP

  selector:
    app: order-service

  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP