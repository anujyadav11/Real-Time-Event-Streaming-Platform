apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: eventstream-infra
  labels:
    app: zipkin
spec:
  replicas: 1

  selector:
    matchLabels:
      app: zipkin

  template:
    metadata:
      labels:
        app: zipkin

    spec:
      containers:
        - name: zipkin
          image: openzipkin/zipkin:latest

          ports:
            - name: http
              containerPort: 9411

          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 300m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 9411
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 9411
            initialDelaySeconds: 30
            periodSeconds: 20