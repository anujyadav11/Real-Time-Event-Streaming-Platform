apiVersion: v1
kind: Service

metadata:
  name: postgres
  namespace: eventstream-infra

  labels:
    app: postgres
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: eventstream

spec:
  type: ClusterIP

  selector:
    app: postgres

  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP