apiVersion: apps/v1
kind: Deployment

metadata:
  name: kafka
  namespace: eventstream-infra

  labels:
    app: kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: eventstream

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kafka

  template:
    metadata:
      labels:
        app: kafka
        app.kubernetes.io/name: kafka
        app.kubernetes.io/part-of: eventstream

    spec:
      containers:
        - name: kafka

          image: apache/kafka:3.9.0

          ports:
            - name: kafka
              containerPort: 29092

            - name: controller
              containerPort: 9093

          env:

            # KRaft
            - name: KAFKA_NODE_ID
              value: "1"

            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"

            - name: KAFKA_CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"

            # Listeners
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093"

            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka.eventstream-infra:9092,PLAINTEXT_INTERNAL://kafka.eventstream-infra:29092"

            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"

            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT_INTERNAL"

            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"

            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"

            # Single broker
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"

            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"

            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "1"

            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"

            # Storage
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"

            limits:
              cpu: "750m"
              memory: "1Gi"

          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data

          readinessProbe:
            tcpSocket:
              port: kafka

            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          livenessProbe:
            tcpSocket:
              port: kafka

            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

      volumes:
        - name: kafka-data
          persistentVolumeClaim:
            claimName: kafka-pvc