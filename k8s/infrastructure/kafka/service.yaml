apiVersion: v1
kind: Service

metadata:
  name: kafka
  namespace: eventstream-infra

  labels:
    app: kafka
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: eventstream

spec:
  type: ClusterIP

  selector:
    app: kafka

  ports:
    - name: kafka
      port: 29092
      targetPort: kafka
      protocol: TCP