apiVersion: apps/v1
kind: Deployment

metadata:
  name: kafka-ui
  namespace: eventstream-infra
  labels:
    app: kafka-ui

spec:
  replicas: 1

  selector:
    matchLabels:
      app: kafka-ui

  template:
    metadata:
      labels:
        app: kafka-ui

    spec:
      containers:

        - name: kafka-ui
          image: provectuslabs/kafka-ui:latest

          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: "eventstream"

            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "kafka.eventstream-infra:29092"

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"

            limits:
              cpu: "300m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 75
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3