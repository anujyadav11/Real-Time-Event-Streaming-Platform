apiVersion: v1
kind: Service

metadata:
  name: redis
  namespace: eventstream-infra

  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: eventstream

spec:
  type: ClusterIP

  selector:
    app: redis

  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP